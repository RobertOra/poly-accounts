<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Accounts">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Accounts</title>
<style>
  :root { --bg:#ffffff; --card:#ffffff; --fg:#14171a; --muted:#6b7280; --faint:#9ca3af; --line:rgba(0,0,0,.09);
    --hover:#f1f2f4; --accent:#1652f0; --up:#16a34a; --down:#dc2626; --chip:#eef0f3; color-scheme:light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0c0e13; --card:#15181f; --fg:#eef0f3; --muted:#9aa3ad; --faint:#6b7480; --line:rgba(255,255,255,.08);
      --hover:#1f232b; --accent:#5b8cff; --up:#22c55e; --down:#f05252; --chip:#232831; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { overflow-x:hidden; font:15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  a { color:inherit; text-decoration:none; }
  .top { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); }
  .top h1 { font-size:22px; font-weight:700; margin:0; flex:none; }
  .seg { display:inline-flex; background:var(--chip); border-radius:9px; padding:3px; }
  .seg button { padding:5px 8px; border-radius:7px; font-size:13px; font-weight:600; color:var(--muted); }
  .seg button.on { background:var(--card); color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .icon-btn { width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); }
  .icon-btn:active { background:var(--hover); }
  .top { flex-wrap:wrap; }
  .segrow { display:flex; }   /* sits right after the title */
  #edit { margin-left:auto; }  /* Edit (Done while editing) and refresh stay at the right */
  .tabs { order:2; display:none; width:100%; gap:6px; overflow-x:auto; scrollbar-width:none; margin:2px -16px -2px; padding:0 16px; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { flex:none; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; color:var(--muted); background:var(--chip); }
  .tabs button.on { background:var(--fg); color:var(--bg); }
  .text-btn { font-size:15px; font-weight:600; color:var(--accent); padding:6px 4px; }
  .editor { padding:8px 16px 40px; max-width:640px; margin:0 auto; }
  .editor h2 { font-size:13px; font-weight:650; color:var(--muted); margin:16px 0 6px; text-transform:none; }
  .erow { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .erow .av { width:34px; height:34px; font-size:15px; }
  .erow .t { flex:1; min-width:0; }
  .erow .t .a { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .erow .t .b { font-size:12px; color:var(--faint); }
  .ebtn { width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); background:var(--chip); }
  .ebtn:disabled { opacity:.35; }
  .erow.hidden .av, .erow.hidden .t { opacity:.45; }
  .handle { width:24px; height:34px; margin-left:-4px; display:inline-flex; align-items:center; justify-content:center; color:var(--faint); touch-action:none; cursor:grab; flex:none; }
  .drow { background:var(--bg); position:relative; }
  .drow.settle { transition:transform .15s ease; }
  .drow.dragging { z-index:3; box-shadow:0 8px 24px rgba(0,0,0,.18); border-radius:10px; transition:none; }
  .ebtn-space { width:34px; flex:none; }
  .kmenu { display:flex; gap:8px; padding:8px 0 10px 74px; border-bottom:1px solid var(--line); }   /* lines up with the name */
  .kmenu .pick { height:34px; padding:0 12px; font-size:13px; background:var(--chip); color:var(--fg); }
  .ebtn.del { color:var(--down); }
  .addbox { display:flex; gap:8px; margin-top:8px; }
  .kadd { display:grid; gap:8px; margin-top:8px; }
  .kadd input, .kadd textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:16px -apple-system, sans-serif; }
  .kadd textarea { font:13px/1.35 ui-monospace, Menlo, monospace; resize:none; }
  .kadd button { height:44px; border-radius:10px; background:var(--accent); color:#fff; font-weight:650; }
  .addbox input { flex:1; min-width:0; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:16px -apple-system, sans-serif; }
  .addbox button, .pick { padding:0 16px; border-radius:10px; background:var(--accent); color:#fff; font-weight:650; }
  .pick { height:34px; padding:0 14px; font-size:14px; }
  .pick:disabled { background:var(--chip); color:var(--muted); }
  .hint2 { font-size:13px; color:var(--muted); margin-top:8px; }
  .updated { font-size:12px; color:var(--faint); padding:8px 16px 0; }
  .list { display:grid; gap:14px; padding:12px 12px max(12px, env(safe-area-inset-bottom)); grid-template-columns:repeat(auto-fill, minmax(min(340px, 100%), 1fr)); }
  .col { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .head { display:flex; align-items:center; gap:12px; padding:14px 14px 10px; }
  .av { width:40px; height:40px; border-radius:50%; flex:none; object-fit:cover; display:inline-flex; align-items:center;
    justify-content:center; color:#fff; font-weight:650; font-size:17px; }
  .who { flex:1; min-width:0; }
  .who .n { display:block; font-weight:650; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who .w { font-size:12px; color:var(--faint); }
  .portfolio { padding:0 14px 8px; }
  .k { font-size:12px; color:var(--muted); }
  .big { font-size:30px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; padding:0 14px 6px; }
  .stat .v { font-size:17px; font-weight:650; font-variant-numeric:tabular-nums; }
  .rewards { padding:0 14px 6px; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .rewards span { font-weight:650; }
  .rewards .note { font-weight:400; color:var(--faint); margin-left:6px; font-size:12px; }
  .mi.glyph { display:inline-flex; align-items:center; justify-content:center; color:var(--up); background:color-mix(in srgb, var(--up) 14%, transparent); }
  .up { color:var(--up); } .down { color:var(--down); }
  .chart { padding:2px 14px 8px; }
  .chart svg { display:block; width:100%; height:92px; overflow:visible; touch-action:pan-y; }
  .chart .tip { height:18px; margin-bottom:4px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
  .empty { font-size:13px; color:var(--faint); padding:6px 14px 12px; }
  .sec { display:flex; align-items:center; justify-content:space-between; padding:12px 14px 4px; border-top:1px solid var(--line);
    font-size:13px; font-weight:650; color:var(--muted); }
  .seg.sm button { padding:5px 12px; font-size:13px; }
  .sec { padding-top:10px; }
  .sec .more { font-weight:600; color:var(--accent); font-size:13px; padding:4px 0 4px 12px; }
  .row { display:flex; align-items:center; gap:10px; padding:8px 14px; }
  a.row:active { background:var(--hover); }
  .row .mi { width:32px; height:32px; border-radius:7px; flex:none; }
  .row img.mi { width:32px; height:32px; border-radius:7px; flex:none; object-fit:cover; background:var(--chip); }
  .row .t { flex:1; min-width:0; }
  .row .t .a { font-size:14px; font-weight:550; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .t .b { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .r { text-align:right; font-variant-numeric:tabular-nums; flex:none; }
  .row .r .a { font-size:14px; font-weight:600; }
  .row .r .b { font-size:12px; }
  .oc { font-weight:650; } .oc.yes { color:var(--up); } .oc.no { color:var(--down); }
  .tag { font-size:11px; font-weight:650; padding:1px 6px; border-radius:5px; background:var(--chip); color:var(--muted); margin-left:6px; }
  .err { font-size:12px; color:var(--down); padding:0 14px 10px; }
  .none { padding:70px 28px; text-align:center; color:var(--muted); }
  .none h2 { color:var(--fg); font-size:20px; margin:0 0 8px; }
  .none textarea { display:block; width:100%; margin:16px 0 10px; padding:10px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); font:13px/1.35 ui-monospace, Menlo, monospace; resize:none; }
  .none .go { width:100%; padding:12px; border-radius:10px; background:var(--accent); color:#fff; font-weight:650; }
  /* phone: one account per screen, swipe sideways (must come after the base .list rule) */
  @media (max-width: 700px) {
    .tabs { display:flex; }
    .list { display:flex; align-items:flex-start; overflow-x:auto; scroll-snap-type:x mandatory; gap:0; padding:12px 0 max(12px, env(safe-area-inset-bottom)); scrollbar-width:none;
      overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
    .list::-webkit-scrollbar { display:none; }
    .list > .col { flex:0 0 calc(100% - 24px); margin:0 12px; scroll-snap-align:center; scroll-snap-stop:always; }
  }
</style>
</head>
<body>
<div class="top">
  <h1>Accounts</h1>
  <div class="segrow"><div class="seg" id="seg"></div></div>
  <div class="tabs" id="tabs"></div>
  <button class="text-btn" id="edit">Edit</button>
  <button class="icon-btn" id="refresh" aria-label="Refresh" style="order:0"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3v4h-4"/></svg></button>
</div>
<div class="updated" id="updated"></div>
<main id="main"></main>
<script src="kalshi.js"></script>
<script>
// Read-only overview of Polymarket accounts, one card each; nothing is combined across accounts.
// This file contains no accounts: the list arrives in the link's #fragment (never sent to any server) and is kept on this device.
(() => {
  const API = 'https://data-api.polymarket.com/v2';
  const PUSD = '0xC011a7E12a19f7B1f670d46F03B03f3342E82DFB', RPC = 'https://polygon-bor-rpc.publicnode.com';
  const RANGES = [['1d', '1D'], ['1w', '1W'], ['1m', '1M'], ['all', 'All']];
  const ROWS = 7;   // positions / activity rows shown before "Show all" / "Show more"
  const store = {
    get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  // ---- accounts: imported from the extension's phone link (#import=...) ----
  const b64urlDecode = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
  // The #import fragment is kept in the address on purpose: iOS gives a home-screen app its own storage, so the saved
  // shortcut must carry the list. (Fragments are never sent to the server.) A pasted link works too (empty state).
  function importLink(text, force) {
    const m = String(text || '').match(/#import=([A-Za-z0-9_-]+)/);
    if (!m || (!force && store.get('importedFrom', '') === m[1])) return false;   // same link as before: keep manual edits
    try {
      const list = JSON.parse(b64urlDecode(m[1]));
      if (Array.isArray(list) && list.length && list.every(a => /^0x[0-9a-f]{40}$/i.test(a.w))) {
        store.set('accounts', list); store.set('importedFrom', m[1]); return true;
      }
    } catch {}
    return false;
  }
  importLink(location.hash);
  let accounts = store.get('accounts', []);
  let kAccts = store.get('kalshiAccounts', []);
  const saveK = () => store.set('kalshiAccounts', kAccts);
  try { localStorage.removeItem('kalshi'); } catch {}           // old access-code setup, no longer used
  {
    const m = String(location.hash).match(/[#&]kalshi=([A-Za-z0-9_-]+)/);
    if (m) {
      try {
        for (const a of KalshiClient.fromLink(m[1])) { kAccts = kAccts.filter(x => x.keyId !== a.keyId); kAccts.push(a); }
        saveK();
      } catch {}
    }
  }
  const listFromHash = h => {
    const raw = decodeURIComponent(String(h || '').replace(/^.*#/, '')).split('&')[0];
    if (!raw || raw.startsWith('import=') || raw.startsWith('k=') || raw.startsWith('kalshi=')) return null;
    const items = raw.split(',').map(x => x.trim().replace(/^@/, '')).filter(Boolean);
    return items.length && items.every(x => /^(0x[0-9a-fA-F]{40}|[A-Za-z0-9_.-]{1,64})$/.test(x)) ? items : null;
  };
  const pendingNames = (() => {
    const items = listFromHash(location.hash);
    return items && store.get('importedFrom', '') !== items.join(',') ? items : null;   // same link as before: keep manual edits
  })();
  const pmInOrder = () => { try { return allItems().filter(x => x.type === 'pm').map(x => x.a); } catch { return accounts; } };
  const shareLink = withKalshi => location.origin + location.pathname + '#' + pmInOrder().map(a => a.u || a.w).join(',') + (withKalshi && kAccts.length ? '&kalshi=' + KalshiClient.toLink(kAccts) : '');
  function syncUrl() {
    const names = pmInOrder().map(a => a.u || a.w).join(',');
    const target = location.pathname + (names ? '#' + names : '');   // Kalshi keys never go in the address bar
    if (location.pathname + location.hash !== target) history.replaceState(null, '', target);
    store.set('importedFrom', names);   // same string as the address, so reopening it isn't treated as a new link
  }
  const saveAccounts = () => { store.set('accounts', accounts); syncUrl(); };
  let range = store.get('range', '1w');
  let active = Math.max(0, store.get('active', 0));   // card shown on a phone (carousel); clamped once cards exist

  // ---- helpers ----
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const usd = (n, sign = false) => {
    if (n == null || !isFinite(n)) return '–';
    const s = Math.abs(n).toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '−' : sign && n > 0 ? '+' : '') + s;
  };
  const pct = n => (n == null || !isFinite(n) ? '' : `(${Math.abs(n).toFixed(1)}%)`);
  const cents = p => (p == null ? '–' : (p * 100 < 1 ? (p * 100).toFixed(1) : Math.round(p * 100)) + '¢');
  const ago = ts => { const s = Math.max(0, Date.now() / 1000 - ts); return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + 'm ago' : s < 86400 ? Math.floor(s / 3600) + 'h ago' : Math.floor(s / 86400) + 'd ago'; };
  const tone = n => (n > 0 ? 'up' : n < 0 ? 'down' : '');
  const hueOf = w => parseInt(w.slice(2, 8), 16) % 360;
  const get = async path => { const r = await fetch(API + path, { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); return (await r.json()).data; };
  const getCash = async w => {
    const r = await fetch(RPC, { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'eth_call', params: [{ to: PUSD, data: '0x70a08231' + w.slice(2).toLowerCase().padStart(64, '0') }, 'latest'] }) });
    const j = await r.json(); if (!j.result) throw new Error('rpc'); return Number(BigInt(j.result)) / 1e6;
  };
  async function loadPositions(w) {
    const all = []; let cursor = '';
    for (let i = 0; i < 5; i++) {
      const r = await fetch(`${API}/positions?user=${w}&limit=100${cursor ? '&cursor=' + encodeURIComponent(cursor) : ''}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); all.push(...(j.data || []));
      cursor = j.pagination?.has_more ? j.pagination.next_cursor : ''; if (!cursor) break;
    }
    return all.sort((a, b) => (b.current_value || 0) - (a.current_value || 0));
  }

  async function loadRewards(w) {
    const all = []; let cursor = '';
    for (let i = 0; i < 5; i++) {
      const r = await fetch(`${API}/activity?user=${w}&type=REWARD&limit=100${cursor ? '&cursor=' + encodeURIComponent(cursor) : ''}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json(); all.push(...(j.data || []));
      cursor = j.pagination?.has_more ? j.pagination.next_cursor : ''; if (!cursor) break;
    }
    return all.map(a => [a.timestamp, +a.usdc_size || 0]).sort((x, y) => x[0] - y[0]);
  }

  // ---- data ----
  const data = {}, ui = { allPos: {}, moreAct: {}, view: store.get('view', 'positions') };
  let updatedAt = 0;
  async function loadAccount(w) {
    const d = data[w] || (data[w] = {});
    const res = await Promise.allSettled([get(`/value?user=${w}`), get(`/user-pnl?user=${w}&interval=${range}`), loadPositions(w),
      get(`/activity?user=${w}&limit=${ui.moreAct[w] ? 40 : ROWS + 1}`), getCash(w), loadRewards(w)]);
    const [value, pnl, positions, activity, cash, rewards] = res;
    if (rewards.status === 'fulfilled') d.rewards = rewards.value;
    if (value.status === 'fulfilled') d.value = value.value?.value;
    if (pnl.status === 'fulfilled') d.pnl = pnl.value?.points || [];
    if (positions.status === 'fulfilled') d.positions = positions.value;
    if (activity.status === 'fulfilled') d.activity = activity.value || [];
    if (cash.status === 'fulfilled') d.cash = cash.value;
    d.error = res.some(x => x.status === 'rejected') ? "Some data didn't load; it will retry." : null;
  }
  const kalshi = { subs: null, error: null, byAcct: {} };
  async function loadKalshi() {
    if (!kAccts.length) { kalshi.subs = null; return; }
    const errs = [];
    await Promise.all(kAccts.map(async a => {
      try { kalshi.byAcct[a.id] = await KalshiClient.summary(a); }
      catch (e) { errs.push(`${a.nick}: ${e.auth ? 'key not accepted' : "didn't load"}`); }
    }));
    kalshi.subs = kAccts.flatMap(a => kalshi.byAcct[a.id] || []);
    kalshi.error = errs.length ? 'Kalshi ' + errs.join(', ') : null;
  }
  let loading = false;
  async function refresh() {
    if (loading || (!accounts.length && !kAccts.length)) return;
    loading = true;
    await Promise.all([...shownAccounts().map(a => loadAccount(a.w).catch(() => {})), loadKalshi()]);
    loading = false; updatedAt = Date.now(); render();
  }

  // ---- rendering ----
  const nameOf = a => a.n || a.w.slice(0, 6) + '…' + a.w.slice(-4);
  const profileUrl = a => (a.u ? `https://polymarket.com/@${encodeURIComponent(a.u)}` : `https://polymarket.com/profile/${a.w}`);
  const avatar = a => a.i ? `<img class="av" src="${esc(a.i)}" alt="">` : `<span class="av" style="background:hsl(${hueOf(a.w)} 55% 42%)">${esc(nameOf(a)[0].toUpperCase())}</span>`;
  const RANGE_SECS = { '1d': 86400, '1w': 7 * 86400, '1m': 30 * 86400 };
  function pnlStats(points, rewards = []) {
    if (!points?.length) return { change: null };
    const paidBy = ts => rewards.reduce((s, [t, x]) => s + (t <= ts ? x : 0), 0);
    const v = p => (p.economic_pnl ?? p.position_pnl ?? 0) + Math.max(0, paidBy(p.timestamp) - (p.reward_income || 0));
    const series = points.map(p => [p.timestamp, v(p)]);
    const last = points[points.length - 1], after = rewards.filter(([t]) => t > last.timestamp).reduce((s, [, x]) => s + x, 0);
    if (after > 0) series.push([Math.floor(Date.now() / 1000), series[series.length - 1][1] + after]);   // payouts since the last P&L point
    const end = series[series.length - 1][1];
    const since = range === 'all' ? 0 : Date.now() / 1000 - RANGE_SECS[range];
    const rewardsInRange = rewards.reduce((s, [t, x]) => s + (t >= since ? x : 0), 0);
    return { change: range === 'all' ? end : end - series[0][1], series, rewardsInRange };
  }
  function chart(series, w) {
    if (!series || series.length < 2) return `<div class="empty">Not enough history for this range yet.</div>`;
    const W = 340, H = 92, ys = series.map(s => s[1]);
    let lo = Math.min(...ys, 0), hi = Math.max(...ys, 0); if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    const x = i => (i / (series.length - 1)) * W, y = v => H - 4 - ((v - lo) / (hi - lo)) * (H - 8);
    const pts = series.map((s, i) => `${x(i).toFixed(1)},${y(s[1]).toFixed(1)}`).join(' ');
    const col = ys[ys.length - 1] >= ys[0] ? 'var(--up)' : 'var(--down)';
    return `<div class="chart" data-w="${w}"><div class="tip"></div>
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">

      const opts = { duration: 320, easing: 'cubic-bezier(.25,.8,.25,1)' };
      ghost.animate([{ transform: 'none' }, { transform: `translateX(${-dir * W}px)` }], opts);
      l.animate([{ transform: `translateX(${dir * W}px)` }, { transform: 'none' }], opts);   // move the row, not the card: a moving card drags the snap with it
      setTimeout(() => { ghost.remove(); jumping = false; }, opts.duration + 30);
      return;
    }
    else l.children[i]?.scrollIntoView({ behavior: smooth ? 'smooth' : 'instant', block: 'start' });
  }
  function render() {
    const names = cardNames();
    if (active > Math.max(0, names.length - 1)) active = Math.max(0, names.length - 1);
    $('tabs').innerHTML = names.length > 1 ? names.map((n, i) => `<button data-tab="${i}" class="${i === active ? 'on' : ''}">${esc(n)}</button>`).join('') : '';
    $('seg').innerHTML = RANGES.map(([k, l]) => `<button data-range="${k}" class="${k === range ? 'on' : ''}">${l}</button>`).join('');
    $('updated').textContent = !names.length && !kAccts.length ? '' : (updatedAt ? 'Updated ' + ago(updatedAt / 1000) + (kalshi.error ? ' · ' + kalshi.error : '') : 'Loading…') + (hiddenCount() ? ` · ${hiddenCount()} hidden` : '');
    $('edit').textContent = ed.open ? 'Done' : accounts.length ? 'Edit' : 'Add';
    $('seg').parentElement.style.display = ed.open ? 'none' : '';
    $('tabs').style.display = ed.open ? 'none' : '';
    $('refresh').style.display = ed.open ? 'none' : '';
    if (ed.open) { $('updated').textContent = ''; $('main').innerHTML = editor(); return; }
    $('main').innerHTML = names.length ? `<div class="list">${shownItems().map(x => (x.type === 'pm' ? card(x.a) : kalshiCard(x.s))).join('')}</div>`
      : `<div class="none"><h2>No accounts yet</h2>Tap <b>Add</b> at the top to add accounts by username, or paste the phone link from the Chrome extension:
          <textarea id="paste" rows="3" placeholder="https://robertora.github.io/poly-accounts/#import=…"></textarea>
          <button class="go" id="usepaste">Add accounts</button><div id="pasteerr" class="err"></div></div>`;
    const l = listEl();
    if (l && isCarousel()) {
      l.scrollLeft = active * l.clientWidth;               // re-rendering must not jump back to the first account
      l.addEventListener('scroll', () => {
        if (jumping) return;
        const i = Math.round(l.scrollLeft / l.clientWidth);
        if (i !== active && i >= 0 && i < cardCount()) {
          active = i; store.set('active', i); markTabs();
          document.querySelector('#tabs .on')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
          const top = l.getBoundingClientRect().top + scrollY - document.querySelector('.top').offsetHeight;
          if (scrollY > top) window.scrollTo({ top, behavior: 'instant' });   // show the new account from its top
        }
      }, { passive: true });
    }
  }

  // chart scrubbing (mouse or finger): show that account's value at that point, above its own chart
  function scrub(e) {
    const box = e.target.closest?.('.chart');
    document.querySelectorAll('.chart').forEach(c => { if (c !== box) { c.querySelector('.cursor')?.setAttribute('visibility', 'hidden'); c.querySelector('.tip').textContent = ''; } });
    if (!box) return;
    const series = seriesMap[box.dataset.w]; if (!series) return;
    const r = box.querySelector('svg').getBoundingClientRect();
    const i = Math.max(0, Math.min(series.length - 1, Math.round(((e.clientX - r.left) / r.width) * (series.length - 1))));
    const cur = box.querySelector('.cursor'), x = (i / (series.length - 1)) * 340;
    cur.setAttribute('x1', x); cur.setAttribute('x2', x); cur.setAttribute('visibility', 'visible');
    const [ts, v] = series[i];
    box.querySelector('.tip').innerHTML = `<span class="${tone(v)}">${usd(v, true)}</span> · ${new Date(ts * 1000).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric' })}`;
  }
  document.addEventListener('submit', async e => {
    if (e.target.id === 'kform') {
      e.preventDefault();
      if (ed.kbusy) return;
      const acct = { id: KalshiClient.newId(), nick: $('knick').value.trim(), keyId: $('kid').value.trim(), pem: $('kpem').value.trim() };
      if (!acct.pem.includes('BEGIN')) acct.pem = `-----BEGIN PRIVATE KEY-----\n${acct.pem.replace(/\s+/g, '')}\n-----END PRIVATE KEY-----`;
      const keep = { nick: $('knick').value, kid: $('kid').value, pem: $('kpem').value };
      ed.kbusy = true; ed.kmsg = ''; render(); Object.assign($('knick'), { value: keep.nick }); $('kid').value = keep.kid; $('kpem').value = keep.pem;
      try {
        await KalshiClient.check(acct);
        kAccts = kAccts.filter(x => x.keyId !== acct.keyId); kAccts.push(acct); saveK();
        ed.kbusy = false; await loadKalshi(); render();
      } catch (err) {
        ed.kbusy = false; ed.kmsg = err.auth ? 'Kalshi did not accept that key. Check the key ID and private key.' : (err.message || "Couldn't reach Kalshi."); render();
        $('knick').value = keep.nick; $('kid').value = keep.kid; $('kpem').value = keep.pem;
      }
      return;
    }
    if (e.target.id !== 'addform') return;
    e.preventDefault();
    const q = $('addq').value;
    if (!q.trim() || ed.busy) return;
    ed.busy = true; ed.msg = ''; render(); $('addq').value = q;
    try {
      const r = await findAccounts(q);
      if (r.link) { ed.busy = false; if (importLink(r.link, true)) location.reload(); else { ed.msg = "That link didn't work."; render(); } return; }
      ed.results = r.list;
    } catch { ed.results = null; ed.msg = "Couldn't reach Polymarket. Try again."; }
    ed.busy = false; render(); $('addq').value = q;
  });
  let drag = null;
  document.addEventListener('pointerdown', e => {
    const h = e.target.closest?.('.handle'); if (!h) return;
    e.preventDefault();
    const row = h.closest('.drow'), rows = [...row.parentElement.querySelectorAll('.drow')];
    drag = { row, rows, from: rows.indexOf(row), to: rows.indexOf(row), startY: e.clientY, rects: rows.map(r => r.getBoundingClientRect()) };
    rows.forEach(r => r.classList.add('settle')); row.classList.add('dragging');
    try { h.setPointerCapture(e.pointerId); } catch {}
  });
  document.addEventListener('pointermove', e => {
    if (!drag) return;
    e.preventDefault();
    const { row, rows, from, rects } = drag, dy = e.clientY - drag.startY, h = rects[from].height;
    row.style.transform = `translateY(${dy}px)`;
    const center = rects[from].top + h / 2 + dy;
    let to = 0;
    rects.forEach((r, j) => { if (j !== from && center > r.top + r.height / 2) to++; });
    drag.to = to;
    rows.forEach((r, j) => {
      if (j === from) return;
      const shift = from < j && j <= to ? -h : to <= j && j < from ? h : 0;
      r.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  }, { passive: false });
  const endDrag = () => {
    if (!drag) return;
    const { rows, from, to } = drag, keys = rows.map(r => r.dataset.key);
    drag = null;
    if (to !== from) {
      const [k] = keys.splice(from, 1); keys.splice(to, 0, k);
      const rest = allItems().map(x => x.key).filter(k2 => !keys.includes(k2));   // keep anything not in the list
      cardOrder = [...keys, ...rest]; store.set('cardOrder', cardOrder); syncUrl();
    }
    render();
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  document.addEventListener('pointermove', scrub);
  document.addEventListener('pointerdown', scrub);

  document.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'edit') {
      ed.open = !ed.open; ed.results = null; ed.msg = '';
      if (!ed.open) { active = Math.min(active, Math.max(0, accounts.length - 1)); store.set('active', active); render(); refresh(); return; }
      render(); return;
    }
    if (b.dataset.copy) {
      const link = shareLink(b.dataset.copy === 'kalshi');
      try { await navigator.clipboard.writeText(link); ed.copied = b.dataset.copy; render(); setTimeout(() => { ed.copied = false; render(); }, 2500); }
      catch { prompt('Copy this link:', link); }
      return;
    }
    if (b.dataset.hidew) {
      const a = accounts.find(x => x.w === b.dataset.hidew); a.h = !a.h; if (!a.h) delete a.h; saveAccounts(); render(); return;
    }
    if (b.dataset.delw) {
      const i = accounts.findIndex(x => x.w === b.dataset.delw), a = accounts[i];
      if (confirm(`Remove ${nameOf(a)} from this list?`)) { accounts.splice(i, 1); delete data[a.w]; saveAccounts(); render(); }
      return;
    }
    if (b.dataset.ksubhide || b.dataset.ksubrename) {
      const [id, n] = (b.dataset.ksubhide || b.dataset.ksubrename).split(':'), k = kAccts.find(x => x.id === id), sn = +n;
      if (b.dataset.ksubhide) {
        k.hiddenSubs = KalshiClient.isHidden(k, sn) ? k.hiddenSubs.filter(x => x !== sn) : [...(k.hiddenSubs || []), sn];
      } else {
        ed.kmenu = null;
      const name = prompt(`Name for ${KalshiClient.subLabel({ ...k, subNames: {} }, sn)} (leave empty for the default):`, k.subNames?.[sn] || '');
        if (name === null) return;
        k.subNames = { ...(k.subNames || {}) };
        if (name.trim()) k.subNames[sn] = name.trim(); else delete k.subNames[sn];
      }
      saveK(); render(); return;
    }
    if (b.dataset.kmenu) { ed.kmenu = ed.kmenu === b.dataset.kmenu ? null : b.dataset.kmenu; render(); return; }
    if (b.dataset.krename) {
      const k = kAccts.find(x => x.id === b.dataset.krename);
      const n = prompt('Nickname for this Kalshi account (leave empty for none):', k.nick || '');
      if (n === null) return;
      k.nick = n.trim(); saveK(); (kalshi.byAcct[k.id] || []).forEach(x => { x.nick = k.nick; }); ed.kmenu = null; render();
      return;
    }
    if (b.dataset.kdel) {
      const k = kAccts.find(x => x.id === b.dataset.kdel);
      if (confirm(`Remove the Kalshi account${k.nick ? ` "${k.nick}"` : ''} and all its subaccounts from this device?`)) {
        kAccts = kAccts.filter(x => x.id !== k.id); saveK(); delete kalshi.byAcct[k.id];
        kalshi.subs = kAccts.flatMap(a => kalshi.byAcct[a.id] || []); render();
      }
      return;
    }
    if (b.dataset.mv) { const [key, d] = b.dataset.mv.split('|'); moveCard(key, +d); syncUrl(); render(); return; }
    if (b.dataset.del) {
      const a = accounts[+b.dataset.del];
      if (confirm(`Remove ${nameOf(a)} from this list?`)) { accounts.splice(+b.dataset.del, 1); delete data[a.w]; saveAccounts(); render(); }
      return;
    }
    if (b.dataset.pick) {
      const a = ed.results.find(x => x.w === b.dataset.pick);
      if (a && !accounts.some(x => x.w === a.w)) { accounts.push(Object.fromEntries(Object.entries(a).filter(([, v]) => v))); saveAccounts(); }
      render(); return;
    }
    if (b.dataset.view) { ui.view = b.dataset.view; store.set('view', ui.view); render(); return; }
    if (b.dataset.tab) { active = +b.dataset.tab; store.set('active', active); markTabs(); goTo(active, true); return; }
    if (b.id === 'usepaste') {
      if (importLink(document.getElementById('paste').value)) location.reload();
      else document.getElementById('pasteerr').textContent = "That doesn't look like a phone link.";
      return;
    }
    if (b.dataset.range) {
      range = b.dataset.range; store.set('range', range);
      for (const w in data) data[w].pnl = null; render();
      await Promise.all(accounts.map(async a => { try { data[a.w].pnl = (await get(`/user-pnl?user=${a.w}&interval=${range}`))?.points || []; } catch { data[a.w].pnl = []; } }));
      render();
    } else if (b.id === 'refresh') { b.style.opacity = '.5'; await refresh(); b.style.opacity = ''; }
    else if (b.dataset.allpos) { ui.allPos[b.dataset.allpos] = !ui.allPos[b.dataset.allpos]; render(); }
    else if (b.dataset.moreact) {
      const w = b.dataset.moreact; ui.moreAct[w] = !ui.moreAct[w];
      try { data[w].activity = await get(`/activity?user=${w}&limit=${ui.moreAct[w] ? 40 : ROWS + 1}`); } catch {}
      render();
    }
  });

  if (pendingNames) {
    $('main').innerHTML = '<div class="none">Finding accounts…</div>';
    resolveNames(pendingNames).then(list => {
      if (list.length) {
        const wasHidden = new Set(accounts.filter(a => a.h).map(a => a.w));   // a new link keeps per-device hidden settings
        accounts = list.map(a => (wasHidden.has(a.w) ? { ...a, h: true } : a)); saveAccounts();
      }
      render(); refresh();
    });
  } else { if (accounts.length) syncUrl(); render(); refresh(); }
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  setInterval(() => { if (updatedAt && !ed.open) $('updated').textContent = 'Updated ' + ago(updatedAt / 1000); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - updatedAt > 20000) refresh(); });
})();
</script>
</body>
</html>
